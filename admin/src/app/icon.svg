<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="admin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="admin-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="32" height="32" rx="7" fill="url(#admin-grad)" />
  
  <!-- Shield with Checkmark -->
  <g filter="url(#admin-glow)">
    <!-- Shield Base -->
    <path
      d="M16 5.5 L24.5 9.2 V15.2 C24.5 20.8 20.9 24.8 16 26.5 C11.1 24.8 7.5 20.8 7.5 15.2 V9.2 Z"
      fill="#ffffff"
      fill-opacity="0.16"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Checkmark inside -->
    <path
      d="M12 16 L14.8 18.8 L20 13.2"
      fill="none"
      stroke="#67e8f9"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
